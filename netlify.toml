[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/part53"
  to = "/part53/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/part53/"
  to = "/part53/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/part53-demo.html"
  to = "/part53/"
  status = 301
  force = true

[[redirects]]
  from = "/demo"
  to = "https://lab.atlaseye.ai"
  status = 302
  force = true

[[redirects]]
  from = "/api/ask"
  to = "/.netlify/functions/ask"
  status = 200


[[redirects]]
  from = "/api/listen"
  to = "/.netlify/functions/listen"
  status = 200


[[redirects]]
  from = "/api/speak"
  to = "/.netlify/functions/speak"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
