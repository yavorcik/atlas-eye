[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[context.deploy-preview.environment]
  VITE_SUPPLIER_SUBMISSION_URL = "https://9u7zmbfpr6.execute-api.us-east-2.amazonaws.com/supplier-submissions"

[context.production.environment]
  VITE_SUPPLIER_SUBMISSION_URL = "https://9u7zmbfpr6.execute-api.us-east-2.amazonaws.com/supplier-submissions"

[[redirects]]
  from = "/part53-workspace"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/part53-workspace/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/part53"
  to = "/part53/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/part53/"
  to = "/part53/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/part53-demo.html"
  to = "/part53/"
  status = 301
  force = true


[[redirects]]
